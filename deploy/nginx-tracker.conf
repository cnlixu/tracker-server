limit_req_zone $binary_remote_addr zone=tracker_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/tracker/web;
    index index.html;

    location = /_tracker_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /login.html {
        try_files /login.html =404;
    }

    location = /login.js {
        try_files /login.js =404;
    }

    location = /style.css {
        try_files /style.css =404;
    }

    location = /admin.css {
        try_files /admin.css =404;
    }

    location = /api/auth/login {
        limit_req zone=tracker_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @tracker_login_redirect {
        return 302 /login.html?next=$request_uri;
    }

    location / {
        auth_request /_tracker_auth;
        error_page 401 = @tracker_login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
